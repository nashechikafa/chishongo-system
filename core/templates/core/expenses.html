<!DOCTYPE html>
<html>
<head>
    <title>Expenses - Chishongo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #0b5d7a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 70%;
            padding: 10px;
        }

        .search-box button, .search-box a {
            padding: 10px 14px;
            background-color: #0b5d7a;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            margin-left: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th {
            background-color: #0b5d7a;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
        }

        .nav {
            margin-top: 20px;
            text-align: center;
        }

        .nav a {
            display: inline-block;
            margin: 10px;
            padding: 12px 18px;
            background-color: #0b5d7a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Business Expenses</h1>
    </div>

    <div class="container">
        <form method="GET" class="search-box">
            <input type="text" name="q" placeholder="Search by recorded by, category, or description" value="{{ query }}">
            <button type="submit">Search</button>
            <a href="/expenses/">Clear</a>
        </form>

        <table>
            <tr>
                <th>Recorded By</th>
                <th>Category</th>
                <th>Description</th>
                <th>Amount</th>
                <th>Date</th>
            </tr>

            {% for expense in expenses %}
            <tr>
                <td>{{ expense.recorded_by }}</td>
                <td>{{ expense.category }}</td>
                <td>{{ expense.description }}</td>
                <td>${{ expense.amount }}</td>
                <td>{{ expense.expense_date }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">No expenses found</td>
            </tr>
            {% endfor %}
        </table>

        <div class="nav">
            <a href="/dashboard/">Dashboard</a>
            <a href="/home/">Home</a>
            <a href="/logout/">Logout</a>
        </div>
    </div>

</body>
</html>
