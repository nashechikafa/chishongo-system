<!DOCTYPE html>
<html>
<head>
    <title>Manager New Product Entry</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #0b5d7a;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 60%;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 16px;
        }

        button {
            background-color: #0b5d7a;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .nav {
            margin-top: 20px;
        }

        .nav a {
            margin-right: 10px;
            text-decoration: none;
            color: #0b5d7a;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Manager New Product Entry</h1>
    </div>

    <div class="container">
        <form method="POST">
            {% csrf_token %}

            <label>Product Name</label>
            <input type="text" name="name" required>

            <label>Opening Quantity</label>
            <input type="number" name="quantity" required>

            <label>Buying Price</label>
            <input type="number" step="0.01" name="buying_price" required>

            <label>Selling Price</label>
            <input type="number" step="0.01" name="selling_price" required>

            <label>Supplier</label>
            <input type="text" name="supplier" required>

            <button type="submit">Add New Product</button>
        </form>

        <div class="nav">
            <a href="/manager-delivery-entry/">Delivery Entry</a>
            <a href="/products/">Inventory</a>
            <a href="/home/">Home</a>
        </div>
    </div>

</body>
</html>
