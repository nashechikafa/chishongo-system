<!DOCTYPE html>
<html>
<head>
    <title>Manager Expense Entry</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #0b5d7a;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 60%;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 16px;
        }

        button {
            background-color: #0b5d7a;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .nav {
            margin-top: 20px;
        }

        .nav a {
            margin-right: 10px;
            text-decoration: none;
            color: #0b5d7a;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Manager Expense Entry</h1>
    </div>

    <div class="container">
        <form method="POST">
            {% csrf_token %}

            <label>Category</label>
            <select name="category" required>
                <option value="Transport">Transport</option>
                <option value="Rent">Rent</option>
                <option value="Wages">Wages</option>
                <option value="Electricity">Electricity</option>
                <option value="Airtime/Data">Airtime/Data</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Miscellaneous">Miscellaneous</option>
            </select>

            <label>Description</label>
            <input type="text" name="description" required>

            <label>Amount</label>
            <input type="number" step="0.01" name="amount" required>

            <button type="submit">Record Expense</button>
        </form>

        <div class="nav">
            <a href="/expenses/">View Expenses</a>
            <a href="/home/">Home</a>
        </div>
    </div>

</body>
</html>
