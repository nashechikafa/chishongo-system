<!DOCTYPE html>
<html>
<head>
    <title>Manager Stock Delivery Entry</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #0b5d7a;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 60%;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 16px;
        }

        button {
            background-color: #0b5d7a;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .nav {
            margin-top: 20px;
        }

        .nav a {
            margin-right: 10px;
            text-decoration: none;
            color: #0b5d7a;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Manager Stock Delivery Entry</h1>
    </div>

    <div class="container">
        <form method="POST">
            {% csrf_token %}

            <label>Product</label>
            <select name="product" required>
                {% for product in products %}
                    <option value="{{ product.id }}">{{ product.name }}</option>
                {% endfor %}
            </select>

            <label>Manager Name</label>
            <input type="text" name="manager_name" required>

            <label>Quantity Added</label>
            <input type="number" name="quantity_added" required>

            <label>Buying Cost Total</label>
            <input type="number" step="0.01" name="buying_cost_total" required>

            <label>Notes</label>
            <textarea name="notes"></textarea>

            <button type="submit">Record Delivery</button>
        </form>

        <div class="nav">
            <a href="/deliveries/">View Deliveries</a>
            <a href="/dashboard/">Dashboard</a>
            <a href="/">Home</a>
        </div>
    </div>

</body>
</html>
